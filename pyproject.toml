[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-daybook"
version = "0.1.0"
description = "Agente de bitácora diaria (informes Markdown + pushes programados)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.28.0",
  "PyYAML>=6.0",
  "psutil>=5.9.0",
  "pystray>=0.19.0",
  "Pillow>=10.0.0",
  "tzdata>=2025.1",
]

[project.scripts]
stellar-daybook = "stellar_daybook.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
