<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StellarDaybook</title>
  <desc id="desc">Diario de actividad de escritorio con subidas automáticas a GitHub, registro de ventanas activas, red, clima y recursos del sistema.</desc>
  <style>
    .star-twinkle {
      animation: twinkle 3s ease-in-out infinite;
    }
    .compass-rotate {
      transform-origin: 160px 148px;
      animation: rotate 25s linear infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 1; }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="100" y1="20" x2="1100" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050811"/>
      <stop offset="0.45" stop-color="#150a24"/>
      <stop offset="1" stop-color="#090510"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="0" x2="960" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5d76e"/>
      <stop offset="0.5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 120) rotate(125) scale(240 200)">
      <stop stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 280) rotate(20) scale(190 150)">
      <stop stop-color="#f5d76e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f5d76e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40" y="-40" width="1280" height="440" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#00020a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="32" fill="url(#bg)"/>
  <circle cx="930" cy="120" r="220" fill="url(#glow)"/>
  <circle cx="250" cy="280" r="180" fill="url(#glow2)"/>

  <g opacity="0.4">
    <circle cx="860" cy="72" r="2.2" fill="#ffffff" class="star-twinkle" style="animation-delay: 0s;"/>
    <circle cx="1030" cy="98" r="1.8" fill="#ffffff" class="star-twinkle" style="animation-delay: 0.8s;"/>
    <circle cx="1090" cy="165" r="1.7" fill="#ffffff" class="star-twinkle" style="animation-delay: 1.6s;"/>
    <circle cx="980" cy="238" r="2.1" fill="#ffffff" class="star-twinkle" style="animation-delay: 0.4s;"/>
    <circle cx="141" cy="96" r="1.7" fill="#ffffff" class="star-twinkle" style="animation-delay: 1.2s;"/>
    <circle cx="192" cy="164" r="1.8" fill="#ffffff" class="star-twinkle" style="animation-delay: 2s;"/>
    <circle cx="332" cy="72" r="2.1" fill="#ffffff" class="star-twinkle" style="animation-delay: 0.6s;"/>
    <circle cx="405" cy="286" r="1.7" fill="#ffffff" class="star-twinkle" style="animation-delay: 1.4s;"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="52" width="1072" height="256" rx="28" fill="#0d0717" fill-opacity="0.72" stroke="rgba(245,215,110,0.15)" stroke-width="1.2"/>
  </g>

  <g>
    <circle cx="160" cy="148" r="52" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="160" cy="148" r="22" fill="url(#accent)"/>
    <g class="compass-rotate">
      <path d="M160 90V72M160 224V206M108 148H90M230 148H212M123 111L110 98M197 185L210 198M123 185L110 198M197 111L210 98" stroke="rgba(255,255,255,0.52)" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M111 148C111 120 133 98 160 98C187 98 209 120 209 148C209 176 187 198 160 198C133 198 111 176 111 148Z" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  </g>

  <text x="270" y="128" fill="#fcf6e5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">StellarDaybook</text>
  <text x="272" y="164" fill="rgba(252,246,229,0.85)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">
    Diario de escritorio con sincronización automática a GitHub y telemetría local
  </text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="272" y="196" width="130" height="36" rx="18" fill="rgba(245,215,110,0.1)" stroke="rgba(245,215,110,0.25)"/>
    <text x="303" y="220" fill="#f5d76e">Markdown</text>
    <rect x="414" y="196" width="118" height="36" rx="18" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.25)"/>
    <text x="447" y="220" fill="#d8c6ff">GitHub</text>
    <rect x="544" y="196" width="112" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="569" y="220" fill="#edf3ff">Windows</text>
    <rect x="668" y="196" width="160" height="36" rx="18" fill="rgba(245,215,110,0.07)" stroke="rgba(255,215,110,0.18)"/>
    <text x="693" y="220" fill="#fcf6e5">Nova / Nexus (Perfiles)</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="rgba(252,246,229,0.88)">
    <text x="272" y="262">Ventana activa</text>
    <text x="410" y="262">Info de red</text>
    <text x="515" y="262">Clima local</text>
    <text x="630" y="262">Muestreo CPU / RAM</text>
    <text x="815" y="262">Subidas programadas</text>
  </g>

  <path d="M272 276H1018" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
</svg>
