<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">StellarDaybook</title>
  <desc id="desc">Animated banner for the StellarDaybook project with orbiting stars and a log card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="52%" stop-color="#0b1f33"/>
      <stop offset="100%" stop-color="#1b2f4f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f1e9"/>
      <stop offset="100%" stop-color="#dfe7f5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6c177"/>
      <stop offset="100%" stop-color="#7ad7ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        1 0 0 0 0.2
        0 1 0 0 0.6
        0 0 1 0 0.9
        0 0 0 0.9 0"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <g opacity="0.9">
    <circle cx="90" cy="78" r="2.3" fill="#fff"/>
    <circle cx="170" cy="250" r="1.8" fill="#fff"/>
    <circle cx="282" cy="126" r="1.5" fill="#fff"/>
    <circle cx="1010" cy="84" r="2.1" fill="#fff"/>
    <circle cx="1090" cy="238" r="1.7" fill="#fff"/>
    <circle cx="930" cy="310" r="1.6" fill="#fff"/>
    <circle cx="750" cy="60" r="1.4" fill="#fff"/>
    <circle cx="640" cy="354" r="2" fill="#fff"/>
    <circle cx="105" cy="352" r="1.5" fill="#fff"/>
  </g>

  <g filter="url(#glow)" opacity="0.65">
    <circle cx="182" cy="135" r="58" fill="#4cc9f0">
      <animate attributeName="r" values="52;62;52" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="282" r="72" fill="#f6c177">
      <animate attributeName="r" values="64;76;64" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(284 74)" filter="url(#shadow)">
    <rect x="0" y="0" width="632" height="272" rx="28" fill="#0f1729" opacity="0.28"/>
    <rect x="16" y="16" width="600" height="240" rx="24" fill="url(#card)"/>

    <g transform="translate(40 44)">
      <circle cx="22" cy="22" r="22" fill="url(#accent)"/>
      <circle cx="22" cy="22" r="7" fill="#ffffff" opacity="0.9"/>
      <circle cx="22" cy="22" r="43" fill="none" stroke="#3f5f86" stroke-dasharray="8 10" opacity="0.45"/>
      <g>
        <circle cx="22" cy="-7" r="4" fill="#f6c177"/>
        <animateTransform attributeName="transform" type="rotate" from="0 22 22" to="360 22 22" dur="7s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="57" cy="22" r="3.5" fill="#7ad7ff"/>
        <animateTransform attributeName="transform" type="rotate" from="0 22 22" to="360 22 22" dur="10s" repeatCount="indefinite"/>
      </g>
    </g>

    <text x="138" y="86" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#13203a">
      StellarDaybook
    </text>
    <text x="140" y="118" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#42516d">
      Daily log, scheduled pushes and visible machine context
    </text>

    <g transform="translate(138 146)">
      <rect x="0" y="0" width="144" height="34" rx="17" fill="#d7e6ff"/>
      <text x="18" y="23" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#26436c">Windows tray</text>
      <rect x="160" y="0" width="154" height="34" rx="17" fill="#e8f6ef"/>
      <text x="176" y="23" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#24614a">Markdown reports</text>
      <rect x="328" y="0" width="150" height="34" rx="17" fill="#fff1dc"/>
      <text x="343" y="23" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#7d4d10">GitHub pushes</text>
    </g>

    <g transform="translate(138 216)">
      <rect x="0" y="0" width="420" height="16" rx="8" fill="#d9e3f0"/>
      <rect x="0" y="0" width="220" height="16" rx="8" fill="url(#accent)">
        <animate attributeName="width" values="160;290;180;220" dur="6s" repeatCount="indefinite"/>
      </rect>
      <circle cx="434" cy="8" r="7" fill="#5eb8ff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="42" font-family="Consolas, Menlo, monospace" font-size="16" fill="#3d4a61">
        Nova / Nexus • timezone America/Santiago • first push 13:30
      </text>
    </g>
  </g>
</svg>
