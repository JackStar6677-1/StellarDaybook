<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">StellarDaybook</title>
  <desc id="desc">Galactic banner for StellarDaybook with deep purple tones, gold accents and a luminous report card.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="45%" stop-color="#0e1230"/>
      <stop offset="100%" stop-color="#26103f"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f5cff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#4d2c8a" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#4d2c8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcb6b" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#d6a94b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d6a94b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#110b24"/>
      <stop offset="50%" stop-color="#1a1431"/>
      <stop offset="100%" stop-color="#251945"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d28b"/>
      <stop offset="50%" stop-color="#8f6bd6"/>
      <stop offset="100%" stop-color="#5ccfe6"/>
    </linearGradient>
    <linearGradient id="pillA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25194a"/>
      <stop offset="100%" stop-color="#38216d"/>
    </linearGradient>
    <linearGradient id="pillB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1d13"/>
      <stop offset="100%" stop-color="#5b3d14"/>
    </linearGradient>
    <linearGradient id="pillC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122c34"/>
      <stop offset="100%" stop-color="#1b5b68"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        1 0 0 0 0.32
        0 1 0 0 0.18
        0 0 1 0 0.75
        0 0 0 0.85 0"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="innerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f0d28b" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#space)"/>

  <g filter="url(#softGlow)" opacity="0.88">
    <circle cx="148" cy="124" r="74" fill="url(#nebulaA)"/>
    <circle cx="1020" cy="290" r="88" fill="url(#nebulaB)"/>
    <circle cx="964" cy="104" r="42" fill="url(#nebulaA)" opacity="0.45"/>
    <circle cx="244" cy="300" r="52" fill="url(#nebulaB)" opacity="0.28"/>
  </g>

  <g opacity="0.95">
    <circle cx="68" cy="82" r="1.8" fill="#f5f2ff"/>
    <circle cx="132" cy="286" r="1.7" fill="#f5f2ff"/>
    <circle cx="208" cy="140" r="1.5" fill="#f5f2ff"/>
    <circle cx="276" cy="70" r="2.1" fill="#fff2bf"/>
    <circle cx="360" cy="258" r="1.6" fill="#f5f2ff"/>
    <circle cx="512" cy="110" r="1.7" fill="#f5f2ff"/>
    <circle cx="606" cy="300" r="1.7" fill="#fff2bf"/>
    <circle cx="708" cy="88" r="1.5" fill="#f5f2ff"/>
    <circle cx="854" cy="132" r="1.8" fill="#f5f2ff"/>
    <circle cx="932" cy="246" r="1.6" fill="#fff2bf"/>
    <circle cx="1080" cy="92" r="2.0" fill="#f5f2ff"/>
    <circle cx="1112" cy="238" r="1.5" fill="#f5f2ff"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="284" y="72" width="632" height="276" rx="28" fill="#090712" opacity="0.34"/>
    <rect x="300" y="88" width="600" height="244" rx="24" fill="url(#card)" stroke="url(#cardEdge)" stroke-width="1.5"/>

    <g transform="translate(336 126)" filter="url(#innerGlow)">
      <circle cx="0" cy="0" r="36" fill="#0d0a1d" stroke="url(#cardEdge)" stroke-width="2"/>
      <circle cx="0" cy="0" r="16" fill="url(#cardEdge)">
        <animate attributeName="r" values="15;18;15" dur="4.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="6" fill="#fff4c8"/>
      <g>
        <circle cx="28" cy="-2" r="3" fill="#f0d28b"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="-30" cy="9" r="2.8" fill="#8f6bd6"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>
      </g>
      <circle cx="0" cy="0" r="54" fill="none" stroke="#d8c6ff" stroke-dasharray="5 9" opacity="0.55"/>
    </g>

    <text x="404" y="140" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#f7f1e6">
      StellarDaybook
    </text>
    <text x="406" y="172" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#b9afd8">
      Daily log, scheduled pushes and visible machine context
    </text>

    <g transform="translate(404 202)">
      <rect x="0" y="0" width="142" height="34" rx="17" fill="url(#pillA)" stroke="#7660b7" stroke-width="1"/>
      <text x="18" y="23" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#efe7ff">Windows tray</text>

      <rect x="156" y="0" width="156" height="34" rx="17" fill="url(#pillC)" stroke="#74d7e8" stroke-width="1"/>
      <text x="172" y="23" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ecffff">Markdown reports</text>

      <rect x="326" y="0" width="150" height="34" rx="17" fill="url(#pillB)" stroke="#f0d28b" stroke-width="1"/>
      <text x="342" y="23" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff4cf">GitHub pushes</text>
    </g>

    <g transform="translate(404 258)">
      <rect x="0" y="0" width="392" height="15" rx="7.5" fill="#2b2441"/>
      <rect x="0" y="0" width="208" height="15" rx="7.5" fill="url(#cardEdge)">
        <animate attributeName="width" values="170;292;188;226" dur="6s" repeatCount="indefinite"/>
      </rect>
      <circle cx="408" cy="7.5" r="6.5" fill="#f0d28b">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="40" font-family="Consolas, Menlo, monospace" font-size="15" fill="#bdb4df">
        Nexus / Nova • timezone America/Santiago • first push 13:30
      </text>
    </g>
  </g>
</svg>
